name: Playwright Tests

on:
  push:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  playwright-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
      PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run tests:headless

      - name: Upload Playwright reports and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn